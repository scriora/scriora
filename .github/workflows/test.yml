name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: scriora_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        volumes:
          - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scriora_test
      DATABASE_SERVICE_ROLE_URL: postgresql://postgres:postgres@localhost:5432/scriora_test
      REDIS_URL: redis://localhost:6379
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "apps/web"
            filter: "scriora-web"
          - name: "apps/api"
            filter: "scriora-api"
          - name: "apps/worker"
            filter: "scriora-worker"
          - name: "packages/core"
            filter: "scriora-core"
          - name: "packages/social"
            filter: "scriora-social"
          - name: "packages/agent"
            filter: "scriora-agent"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: "11.21.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - name: Run Tests for ${{ matrix.name }}
        run: pnpm turbo run test --filter=${{ matrix.filter }}
