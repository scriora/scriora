name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-e2e:
    name: apps/web E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: "11.21.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter scriora-web build
      - run: pnpm --filter scriora-web test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: scriora_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d scriora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scriora_test
      DATABASE_SERVICE_ROLE_URL: postgresql://postgres:postgres@localhost:5432/scriora_test
      REDIS_URL: redis://localhost:6379
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "apps/web"
            filter: "scriora-web"
          - name: "apps/api"
            filter: "scriora-api"
          - name: "apps/worker"
            filter: "scriora-worker"
          - name: "packages/core"
            filter: "scriora-core"
          - name: "packages/social"
            filter: "scriora-social"
          - name: "packages/agent"
            filter: "scriora-agent"
          - name: "packages/mcp"
            filter: "scriora-mcp"
    steps:
      - uses: actions/checkout@v4
      - name: Initialize PostgreSQL extensions
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d scriora_test -f docker/init-pgvector.sql
      - uses: pnpm/action-setup@v6
        with:
          version: "11.21.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - name: Apply Prisma migrations
        run: pnpm db:migrate:deploy
      - name: Run Tests for ${{ matrix.name }}
        run: pnpm turbo run test --filter=${{ matrix.filter }}
